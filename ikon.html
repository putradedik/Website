<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Mood</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('bg_ikon.jpg') no-repeat center center/cover;
    flex-direction: column;
    text-align: center;
    animation: fadeIn 1s ease-in-out;
    padding: 20px;
    overflow-x: hidden;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}
h2 {
    font-size: 28px;
    margin-bottom: 40px;
    color: #ffd700;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    position: relative;
    padding-bottom: 10px;
}
h2::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #ffd700, transparent);
}
.container {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 800px;
    margin: 0 auto;
}
.icon-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.3s ease;
    text-decoration: none;
}
.icon-container:hover {
    transform: translateY(-10px);
}
.icon-box {
    width: 140px;
    height: 140px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    cursor: pointer;
    font-size: 60px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}
.icon-box::before {
    content: "•"; /* Fallback content */
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 60px;
    line-height: 1;
}
.icon-box:hover::before {
    animation: none; /* Disable animation on hover to prevent flickering */
}

/* Ikon spesifik */
.icon-box.bunga::before { content: "🌷"; animation: rotateFlower 3s infinite ease-in-out; }
.icon-box.boneka::before { content: "🧸"; animation: shakeTeddy 2s infinite ease-in-out; }
.icon-box.topi::before { content: "🎉"; animation: bounceHat 1.5s infinite; }
.icon-box.quiz::before { content: "📋"; animation: rotateQuiz 4s linear infinite; }

/* Animasi */
@keyframes rotateFlower {
    0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
    50% { transform: translate(-50%, -50%) rotate(15deg) scale(1.1); }
    100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
}
@keyframes shakeTeddy {
    0%, 100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
    25% { transform: translate(-50%, -50%) rotate(-15deg) scale(1.05); }
    50% { transform: translate(-50%, -50%) rotate(15deg) scale(1.05); }
    75% { transform: translate(-50%, -50%) rotate(-10deg) scale(1.05); }
}
@keyframes bounceHat {
    0%, 100% { transform: translate(-50%, -50%) translateY(0) scale(1); }
    50% { transform: translate(-50%, -50%) translateY(-15px) scale(1.1); }
}
@keyframes rotateQuiz {
    0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
    100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
}

.label {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
    transition: all 0.3s ease;
}
.icon-container:hover .label {
    color: #ffd700;
    transform: scale(1.05);
}

/* Tombol Kembali */
.kembali {
    margin-top: 50px;
    display: inline-block;
    padding: 14px 28px;
    font-size: 18px;
    color: white;
    background: rgba(255,215,0,0.2);
    border: 2px solid #ffd700;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    transition: all 0.3s ease;
}
.kembali:hover {
    background: rgba(255,215,0,0.3);
    color: #ffd700;
    box-shadow: 0 0 15px rgba(255,215,0,0.5);
}

/* Responsif */
@media (max-width: 768px) {
    h2 {
        font-size: 22px;
        margin-bottom: 30px;
    }
    .container {
        gap: 25px;
    }
    .icon-box {
        width: 110px;
        height: 110px;
    }
    .icon-box::before {
        font-size: 50px;
    }
    .label {
        font-size: 16px;
    }
}
@media (max-width: 480px) {
    h2 {
        font-size: 20px;
    }
    .container {
        gap: 15px;
    }
    .icon-box {
        width: 90px;
        height: 90px;
    }
    .icon-box::before {
        font-size: 40px;
    }
    .label {
        font-size: 14px;
    }
    .kembali {
        font-size: 16px;
        padding: 12px 24px;
    }
}
</style>
</head>
<body>

<h2>🌷 Klik Ikon 🍂</h2>
<div class="container">
    <div class="icon-container" onclick="openPage('halaman_pohon.html')">
        <div class="icon-box bunga"></div>
        <div class="label">Bunga</div>
    </div>
    <div class="icon-container" onclick="openPage('claw-machine.html')">
        <div class="icon-box boneka"></div>
        <div class="label">Mesin Capit</div>
    </div>
    <div class="icon-container" onclick="openPage('quiz.html')">
        <div class="icon-box quiz"></div>
        <div class="label">Quiz</div>
    </div>
</div>

<!-- Tombol Kembali -->
<div class="kembali" onclick="window.location.href='halaman.html'">
    🔙 Kembali ke Halaman Kado
</div>

<script>
function openPage(page) {
    let icon = event.currentTarget.querySelector(".icon-box");
    // Simpan transform asli
    const originalTransform = window.getComputedStyle(icon).transform;
    
    // Efek klik
    icon.style.transform = originalTransform + " scale(1.2)";
    
    setTimeout(() => {
        // Kembalikan ke semula
        icon.style.transform = originalTransform;
        window.location.href = page;
    }, 300);
}

// Pastikan ikon tetap terlihat saat halaman dimuat
window.addEventListener('load', function() {
    const icons = document.querySelectorAll('.icon-box');
    icons.forEach(icon => {
        icon.style.visibility = 'visible';
        icon.style.opacity = '1';
    });
});
</script>

</body>
</html>
