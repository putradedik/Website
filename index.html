<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>SELAMAT DATANG</h2>
        <p>Login dulu baru boleh masuk 😏</p>
        <form onsubmit="return validateLogin(event)">
            <input type="text" id="username" placeholder="Username" required>
            <input type="text" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p id="error-message" class="error"></p>
    </div>

    <script>
        function validateLogin(event) {
            event.preventDefault();

            // Ambil input & normalisasi
            let username = document.getElementById("username").value.trim().toLowerCase();
            let password = document.getElementById("password").value.trim();

            // Data yang benar
            const correctUsername = "arta imelia";
            const correctPassword = "1624"; 

            // Samakan format password jadi string sebelum dibandingkan
            if (username === correctUsername && String(password) === correctPassword) {
                window.location.href = "halaman.html"; 
            } else {
                document.getElementById("error-message").innerText = "Username atau password salah!";
            }
        }
    </script>
</body>
</html>
